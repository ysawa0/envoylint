name = "envoylint-v3-clean"
main = "worker.js"
compatibility_date = "2025-07-19"

# Durable Object migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Container"]

# Environment variables for Envoy versions configuration
[vars]
VERSIONS_CONFIG = '''
{
  "1.34.1": {
    "url": "https://github.com/envoyproxy/envoy/releases/download/v1.34.1/envoy-contrib-1.34.1-linux-x86_64"
  }
}
'''

# Durable Object binding for container
[[durable_objects.bindings]]
name = "ENVOY_VALIDATOR"
class_name = "Container"

# Container configuration
[[containers]]
name = "envoy-validator"
class_name = "Container"
image = "./Dockerfile"
max_instances = 10
instance_type = "basic"

[containers.env_vars]
VERSIONS_CONFIG = '''
{
  "1.34.1": {
    "url": "https://github.com/envoyproxy/envoy/releases/download/v1.34.1/envoy-contrib-1.34.1-linux-x86_64"
  }
}
'''
PORT = "8080"